services:
  api:
    build:
      context: .
    restart: unless-stopped
    # 👇 [추가] 컨테이너 종료 시 기존 요청 처리를 위해 최대 10초 동안 대기
    stop_grace_period: 10s
    stop_signal: SIGTERM
    env_file:
      - path: .env
        required: false
    environment:
      PAKIT_DATABASE_HOST: db
      PAKIT_DATABASE_PORT: 5432
      PAKIT_DATABASE_NAME: ${POSTGRES_DB:-pakit}
      PAKIT_DATABASE_USER: ${POSTGRES_USER:-pakit}
      PAKIT_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pakit}
      POSTGRES_USER: ${POSTGRES_USER:-pakit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  front:
    build:
      context: ../frontend-app
    restart: unless-stopped
    # Nginx(프론트)도 안전한 종료를 위해 5초 정도 유예를 주면 좋습니다.
    stop_grace_period: 5s
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres_data:
