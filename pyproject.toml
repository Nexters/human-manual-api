[project]
name = "pakit-backend"
version = "0.1.0"
description = "나 사용 설명서(Pakit) FastAPI backend"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.16",
  "asyncpg>=0.30",
  "fastapi>=0.116",
  "pydantic-settings>=2.10",
  "sqlalchemy[asyncio]>=2.0",
  "uvicorn[standard]>=0.35",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.21",
  "httpx2>=2.10.0",
  "mypy>=1.17",
  "pytest>=8.4",
  "pytest-cov>=6.2",
  "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pakit"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["pakit"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# 결과 조합 지도는 사실상 HTML/CSS/JS 마크업 문자열 모듈이라
# 긴 마크업 줄(E501)과 표시용 특수문자(RUF001: × – ↔ 등)를 그대로 둔다.
"src/pakit/web/result_map.py" = ["E501", "RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["pakit"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
