name: Deploy FastAPI (uv + Docker) to Gabia

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Deploy to Gabia Cloud via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.GAIA_HOST }}
          username: ${{ secrets.GAIA_USERNAME }}
          key: ${{ secrets.GAIA_SSH_KEY }}
          request_pty: true
          script: |
            # 1. 서버 내부 프로젝트 폴더로 이동
            cd /home/ubuntu/my-fastapi
            
            # 2. 깃허브 최신 코드로 강제 동기화 (충돌 방지)
            git fetch origin main
            git reset --hard origin/main
            
            # 3. uv 기반 Docker 이미지 빌드 및 컨테이너 재실행 (DB 포함)
            docker compose down
            docker compose up --build -d