name: Deploy FastAPI (uv + Docker) to Gabia

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Deploy to Gabia Cloud via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.GAIA_HOST }}
          username: ${{ secrets.GAIA_USERNAME }}
          key: ${{ secrets.GAIA_SSH_KEY }}
          request_pty: true
          script: |
            # 1. 서버 내부 프로젝트 폴더로 이동
            cd /home/ubuntu/my-fastapi
            
            # 2. 깃허브 최신 코드로 강제 동기화 (충돌 방지)
            git fetch origin main
            git reset --hard origin/main
            
            # 3. 백엔드 서비스 무중단 빌드 및 교체 (DB는 내리지 않고 유지)
            docker compose build api
            docker compose up -d --no-deps api
            
            # 4. 사용하지 않는 찌꺼기 이미지 정리
            docker image prune -f
