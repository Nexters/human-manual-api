name: Deploy FastAPI (uv + Docker) to Gabia

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Deploy to Gabia Cloud via SSH
        uses: appleboy/ssh-action@master
        env:
          PAKIT_ADMIN_USERNAME: ${{ secrets.PAKIT_ADMIN_USERNAME }}
          PAKIT_ADMIN_PASSWORD: ${{ secrets.PAKIT_ADMIN_PASSWORD }}
          PAKIT_USAGE_TRACKING_STARTED_AT: ${{ secrets.PAKIT_USAGE_TRACKING_STARTED_AT }}
        with:
          host: ${{ secrets.GAIA_HOST }}
          username: ${{ secrets.GAIA_USERNAME }}
          key: ${{ secrets.GAIA_SSH_KEY }}
          envs: PAKIT_ADMIN_USERNAME,PAKIT_ADMIN_PASSWORD,PAKIT_USAGE_TRACKING_STARTED_AT
          request_pty: true
          script: |
            # 1. 서버 내부 프로젝트 폴더로 이동
            cd /home/ubuntu/my-fastapi
            
            # 2. 깃허브 최신 코드로 강제 동기화 (충돌 방지)
            git fetch origin main
            git reset --hard origin/main

            # 3. GitHub Secrets로 관리자 설정만 갱신 (기존 DB 설정은 보존)
            python3 - <<'PY'
            import os
            from pathlib import Path

            keys = (
                "PAKIT_ADMIN_USERNAME",
                "PAKIT_ADMIN_PASSWORD",
                "PAKIT_USAGE_TRACKING_STARTED_AT",
            )
            values = {key: os.environ.get(key, "") for key in keys}
            missing = [key for key, value in values.items() if not value]
            if missing:
                raise SystemExit(f"Missing required GitHub Secrets: {', '.join(missing)}")
            if any("\n" in value or "\r" in value for value in values.values()):
                raise SystemExit("Admin secrets must not contain line breaks")

            env_path = Path(".env")
            existing = env_path.read_text() if env_path.exists() else ""
            kept_lines = [
                line for line in existing.splitlines() if line.split("=", 1)[0] not in keys
            ]

            def dotenv_literal(value: str) -> str:
                return "'" + value.replace("\\", "\\\\").replace("'", "\\'") + "'"

            updated_lines = kept_lines + [
                f"{key}={dotenv_literal(values[key])}" for key in keys
            ]
            temp_path = env_path.with_suffix(".tmp")
            temp_path.write_text("\n".join(updated_lines) + "\n")
            temp_path.chmod(0o600)
            temp_path.replace(env_path)
            PY

            # 4. 백엔드 서비스 무중단 빌드 및 교체 (DB는 내리지 않고 유지)
            docker compose build api
            docker compose up -d --no-deps api

            # 5. 사용하지 않는 찌꺼기 이미지 정리
            docker image prune -f
